citations:
    - repo: yayolande/gota
      branch: master
      last_checked_sha: 46acdb27bc3801e1b13bad8809f708d96e00428c
      last_checked_date: "2026-03-21T17:50:15Z"
      paths:
        high: [analyzer.go, parser/**, lexer/**, template.go]
        medium: [go.mod, go.sum, '*_test.go']
        low: [.github/**, README.md, LICENSE]
    - repo: yayolande/go-template-lsp
      branch: master
      last_checked_sha: e79b308f1c0e1a0f7b8e4ae79d94eb3eaa631d4c
      last_checked_date: "2026-03-21T17:50:15Z"
      paths:
        high: [lsp/**, main.go]
        medium: [go.mod, go.sum, '*_test.go']
        low: [.github/**, README.md, LICENSE, .gitignore]
todo:
    default_status: draft
    default_type: task
    path: .issues
    sync:
        github:
            repo: toba/go-template-lsp
zed_extension: toba/gozer
nope:
    rules:
        - name: git-no-verify
          pattern: 'git\s+.*--no-verify'
          message: "--no-verify is never allowed - fix the issue that's failing the hook instead"
        - name: git-checkout-switch
          pattern: 'git\s+(checkout|switch)\s+'
          message: "git checkout/switch not allowed - branch changes require user approval"
changelog: weekly
